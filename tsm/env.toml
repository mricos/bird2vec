[service]
name = "b2v"
command = "python3 -m http.server $PORT"
description = "bird2vec - latent space audio synthesis dashboard"

[shared]
HOST = "localhost"
SAMPLE_RATE = "16000"
AUDIO_LENGTH = "16384"
LATENT_DIM = "100"
MODEL_SEED = "42"
GEN_MODE = "harmonic"
CHUNK_OVERLAP = "0.5"
SYNTHETIC_COUNT = "50"
XC_DEFAULT_QUERY = 'en:"common blackbird"'

[secrets]
XC_API_KEY = "$XC_API_KEY"

[local]
TSM_NAME = "b2v"
PORT = "6201"
DATA_DIR = "$HOME/src/bird2vec/data"
MODEL_DIR = "$HOME/src/bird2vec/models"
OUTPUT_DIR = "$HOME/src/bird2vec/output"
cwd = "$HOME/src/bird2vec"
